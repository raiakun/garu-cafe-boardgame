<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゲーム詳細 | がるカフェ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <a href="index.html"><h1>がるカフェ ボードゲーム検索</h1></a>
</header>

<main>
  <a class="back-link" href="index.html">&larr; 一覧に戻る</a>

  <div id="gameDetail">
    <p class="empty-state">読み込み中...</p>
  </div>

  <section class="comments-section">
    <h3>コメント・評価</h3>
    <div class="comment-list" id="commentList"></div>

    <form class="comment-form" id="commentForm">
      <div>
        <label for="commentName">お名前</label>
        <input type="text" id="commentName" maxlength="30" required>
      </div>
      <div>
        <label for="commentRating">評価</label>
        <select id="commentRating" required>
          <option value="5">★★★★★ (5)</option>
          <option value="4">★★★★☆ (4)</option>
          <option value="3" selected>★★★☆☆ (3)</option>
          <option value="2">★★☆☆☆ (2)</option>
          <option value="1">★☆☆☆☆ (1)</option>
        </select>
      </div>
      <div>
        <label for="commentText">コメント</label>
        <textarea id="commentText" rows="3" maxlength="500" required></textarea>
      </div>
      <button type="submit">投稿する</button>
      <p class="form-message" id="formMessage"></p>
    </form>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/game.js"></script>
</body>
</html>
