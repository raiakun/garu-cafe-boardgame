<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ボードゲーム検索 | がるカフェ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <h1>がるカフェ ボードゲーム検索</h1>
</header>

<main>
  <section class="filter-bar" id="filterBar">
    <div class="filter-field">
      <label for="searchName">ゲーム名で検索</label>
      <input type="text" id="searchName" placeholder="例: アグリコラ">
    </div>

    <div class="filter-field">
      <label for="filterGenre">ジャンル</label>
      <select id="filterGenre">
        <option value="">すべて</option>
      </select>
    </div>

    <div class="filter-field">
      <label for="filterPlayers">人数</label>
      <select id="filterPlayers">
        <option value="">すべて</option>
        <option value="1">1人</option>
        <option value="2">2人</option>
        <option value="3">3人</option>
        <option value="4">4人</option>
        <option value="5">5人</option>
        <option value="6">6人</option>
        <option value="7">7人</option>
        <option value="8">8人以上</option>
      </select>
    </div>

    <div class="filter-field">
      <label for="filterTime">プレイ時間</label>
      <select id="filterTime">
        <option value="">すべて</option>
        <option value="30">30分以内</option>
        <option value="60">60分以内</option>
        <option value="90">90分以内</option>
        <option value="120">120分以内</option>
        <option value="121">120分以上</option>
      </select>
    </div>

    <div class="filter-field">
      <label for="filterDifficulty">難易度</label>
      <select id="filterDifficulty">
        <option value="">すべて</option>
      </select>
    </div>

    <button id="resetFilters" type="button">条件をリセット</button>
  </section>

  <p class="result-count" id="resultCount"></p>

  <div class="game-grid" id="gameGrid">
    <p class="empty-state">読み込み中...</p>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
